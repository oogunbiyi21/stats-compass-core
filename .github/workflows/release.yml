# Publish to PyPI when main carries a version PyPI does not have yet.
#
# Runs only after CI has passed on a push to main, and builds that exact commit
# (the CI run's head_sha), so nothing ships that the tests did not pass.
# Merging a pull request that bumps the version in pyproject.toml is the
# release go; a push that keeps the version does nothing here.
#
# Publishing uses PyPI trusted publishing (OIDC): PyPI trusts this workflow
# file, in this repository, in the "pypi" environment. There is no token
# secret. See docs/release-process.md.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: stats-compass-core

jobs:
  build:
    name: build
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.pypi.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read the version
        id: version
        run: |
          version="$(python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); print(d.get('project', {}).get('version') or d['tool']['poetry']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml declares $PACKAGE $version"

      - name: Is it already on PyPI?
        id: pypi
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/${{ steps.version.outputs.version }}/json")"
          case "$status" in
            200) echo "release=false" >> "$GITHUB_OUTPUT"; echo "Already on PyPI: nothing to release." ;;
            404) echo "release=true" >> "$GITHUB_OUTPUT"; echo "Not on PyPI yet: releasing." ;;
            *) echo "::error::PyPI answered $status; not guessing whether to release."; exit 1 ;;
          esac

      - name: Build
        if: steps.pypi.outputs.release == 'true'
        run: |
          pip install poetry
          poetry build

      - uses: actions/upload-artifact@v4
        if: steps.pypi.outputs.release == 'true'
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stats-compass-core/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    name: tag
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Tag the released commit
        run: |
          tag="v${{ needs.build.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; leaving it."
            exit 0
          fi
          git tag "$tag" "${{ github.event.workflow_run.head_sha }}"
          git push origin "$tag"
